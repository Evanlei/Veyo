name: veyo

services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8080"
    volumes:
      - creative_files:/app/storage
    environment:
      VEYO_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  creative_files:
